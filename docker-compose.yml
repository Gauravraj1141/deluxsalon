services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not exposed publicly - only reachable by other containers on this network.

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/music_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to localhost only - Caddy (on the same VPS) proxies to this port.
      # Never expose 8000 to the public internet directly: uvicorn is configured
      # to trust X-Forwarded-For from any peer that can reach it (see Dockerfile),
      # which would let an internet client spoof its IP for rate limiting otherwise.
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
