<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} · Playlist Admin</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2e38;
      --text: #e6e8ec;
      --muted: #9aa0ac;
      --accent: #4f8cff;
      --accent-hover: #6fa1ff;
      --danger: #e5484d;
      --danger-hover: #ff6166;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    nav .brand { font-weight: 600; font-size: 16px; color: var(--text); }
    nav .links a { margin-left: 18px; font-size: 14px; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 0 0 16px; color: var(--muted); font-weight: 500; }
    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: 4px 9px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .empty { color: var(--muted); padding: 24px 0; text-align: center; }
    form.inline { display: inline; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .field { margin-bottom: 16px; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    .field input, .field textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #0c0e12;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .error-banner {
      background: rgba(229,72,77,0.12);
      border: 1px solid var(--danger);
      color: #ff9a9d;
      padding: 10px 14px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 14px;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .order-pill {
      display: inline-block;
      min-width: 22px;
      text-align: center;
      background: #0c0e12;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <nav>
    <span class="brand">🎵 Playlist Admin</span>
    <span class="links">
      <a href="/admin/playlists">Playlists</a>
      <a href="/admin/visitors">Visitors</a>
      <a href="/admin/logout">Logout</a>
    </span>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
