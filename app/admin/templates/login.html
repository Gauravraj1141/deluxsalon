<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Playlist Admin</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2e38;
      --text: #e6e8ec;
      --muted: #9aa0ac;
      --accent: #4f8cff;
      --accent-hover: #6fa1ff;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .login-card {
      width: 320px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; text-align: center; }
    p.sub { color: var(--muted); font-size: 13px; text-align: center; margin: 0 0 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    .field input {
      width: 100%;
      padding: 9px 11px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #0c0e12;
      color: var(--text);
      font-size: 14px;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%;
      padding: 10px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: var(--accent-hover); }
    .error-banner {
      background: rgba(229,72,77,0.12);
      border: 1px solid #e5484d;
      color: #ff9a9d;
      padding: 10px 14px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🎵 Playlist Admin</h1>
    <p class="sub">Sign in to manage playlists and songs</p>
    {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
